name: progress-report

# Builds the objdiff progress report on every push and uploads it as the
# artifact decomp.dev ingests (`<version>_report` -> `nfs4-f_report`).
#
# No splat / ROM / NFS4.MAP needed: asm/, src/ and configs/symbol_addrs.txt are
# committed, so CI only diffs the committed asm (expected) vs source (base).
#
# ONE-TIME SETUP (you, once):
#   The PsyQ cc1 is copyrighted, so it is not in this public repo. Build a zip
#   of the Windows toolchain laid out as:
#       toolchain/psyq/CC1PSX.EXE
#       toolchain/psyq/CC1PLPSX44.EXE <- retail PsyQ 4.4's C++ cc1plus
#                                       (gcc 2.8.1-SN), the PER_FN_CC1PLUS_
#                                       VER_SPLICE "2.8.1-sn" rung; build.py
#                                       auto-finds it BESIDE CC1PSX.EXE.
#                                       Source: psq44/pssn/bin/CC1PLPSX.EXE,
#                                       renamed.  sha256 70319c94de27924f5720
#                                       af361afd2aa7e6de051a7718e0c1a7f07b57
#                                       fa92109c.  If absent, its one splice
#                                       fn (Night_CreateNightTableElement)
#                                       falls back to the default C++ lane
#                                       and reads ~91% on the report instead
#                                       of its sealed 100.
#       toolchain/psyq/CC1PSX272.EXE <- PsyQ 4.0's cc1 (gcc 2.7.2.SN32), the
#                                       04M syslib lane; build.py auto-finds it
#                                       BESIDE CC1PSX.EXE (no env var needed).
#                                       Source: psyq400/COMPILER/CC1PSX.EXE,
#                                       renamed. If absent, lane TUs fall back
#                                       to the 2.8 pipeline with a warning.
#       toolchain/gcc-ladder/gcc-<ver>-psx/cc1.exe
#                                    <- w52: the FSF gcc ladder rungs (2.6.0,
#                                       2.6.3, 2.7.2-970404, 2.7.2, 2.8.0,
#                                       2.8.1, 2.91.66, 2.95.2) from the
#                                       windows-gcc-psx fork, for the per-TU
#                                       cc1_alt/cc1_ver lanes. build.py finds
#                                       them BESIDE psyq/ (no env var). If a
#                                       rung is absent, its TUs fall back to
#                                       the cc1_272/default lane with a
#                                       warning (build stays green, those
#                                       TUs' match numbers drift low).
#       toolchain/gcc-ladder/gcc-2.8.1-norcse-psx/cc1.exe
#                                    <- FntFlush's Sony vendor-object identity;
#                                       SHA256 ACD92ABB94AA9379889521EA5DFA6BC7E22AE66F5E0BF70D7131E11A4F899668.
#                                       PE timestamp/checksum-normalized SHA256
#                                       558A47C2197A27BE9B1D36C1D2B7B53713E09DC0C93698281696973C3CDAC591.
#                                       build.py enforces the normalized code-
#                                       identity hash and rejects real drift.
#       toolchain/mips/bin/mipsel-none-elf-{cpp,as,ld,objcopy}.exe (+ DLLs)
#       toolchain/maspsx/maspsx.py   <- apply tools/maspsx-lid-reg.patch first
#                                       (completes the li.d $N register LUT; without
#                                        it game/psx/fe3dmenu.cpp fails: "Unknown
#                                        mapping for $16")
#   Host it and add the download link as the repo secret  TOOLCHAIN_ZIP_URL .
#   A Dropbox share link works directly (the workflow forces dl=1); any other
#   direct-download URL works too. (MEGA links need a client and are NOT
#   supported by this fetch step.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  report:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit vtable indexing
        run: python tools/audit_vtable_indexing.py

      - name: Audit source-only matching policy
        run: python tools/textmoves_audit.py

      - name: Fetch toolchain (PsyQ cc1 + mipsel binutils + maspsx)
        shell: pwsh
        run: |
          # Direct-download link (e.g. Dropbox). Force dl=1 so Dropbox returns
          # the file itself, not its HTML preview page. Invoke-WebRequest follows
          # the redirect to dl.dropboxusercontent.com automatically.
          $url = "${{ secrets.TOOLCHAIN_ZIP_URL }}" -replace 'dl=0','dl=1'
          Invoke-WebRequest -Uri $url -OutFile toolchain.zip
          if ((Get-Item toolchain.zip).Length -lt 1MB) { throw "download too small - not the zip (check the link / dl=1)" }
          Expand-Archive toolchain.zip -DestinationPath ${{ github.workspace }}/tc -Force

      - name: Build expected (target) + base, generate report
        shell: pwsh
        env:
          NFS4_CC1:      ${{ github.workspace }}/tc/toolchain/psyq/CC1PSX.EXE
          NFS4_CC1PL:    ${{ github.workspace }}/tc/toolchain/psyq/CC1PLPSX.EXE
          NFS4_MIPS_BIN: ${{ github.workspace }}/tc/toolchain/mips/bin
          # maspsx is VENDORED in-repo (tools/maspsx, MIT) so CI runs the exact
          # same patched assembler stack as the local gate (--jtbl-at-fusion +
          # generalized .section parsing). The copy inside the toolchain zip is
          # stale — do not point at it.
          NFS4_MASPSX:   ${{ github.workspace }}/tools/maspsx/maspsx.py
        run: |
          python tools/build.py --out expected --no-link
          python tools/build.py --skip-asm
          # objdiff-cli is COMMITTED at tools/objdiff (v3.8.0): the report tool is
          # version-locked by the repo itself -- no 'latest' drift vs local runs.
          ./tools/objdiff/objdiff-cli.exe report generate -p . -o nfs4-f_report.binpb -f proto

      - name: Upload report artifact for decomp.dev
        uses: actions/upload-artifact@v4
        with:
          name: nfs4-f_report
          path: nfs4-f_report.binpb
